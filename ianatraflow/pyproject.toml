[project]
name = "ianatraflow"
version = "0.1.0"
description = "ianatraflow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.117.1,<1.0.0",
]

[project.scripts]
kickoff = "ianatraflow.main:kickoff"
run_crew = "ianatraflow.main:kickoff"
plot = "ianatraflow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
